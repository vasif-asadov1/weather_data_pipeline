dbt_transformations:
  outputs:
    dev:
      type: duckdb
      path: 'weather_warehouse.duckdb'
      extensions:
        - httpfs
      settings:
        s3_endpoint: '127.0.0.1:4566'
        s3_access_key_id: 'test'
        s3_secret_access_key: 'test'
        s3_use_ssl: false
        s3_url_style: 'path'
  target: dev